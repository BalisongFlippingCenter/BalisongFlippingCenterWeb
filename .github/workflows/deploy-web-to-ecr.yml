name: Build and Push Docker Image to ECR

# runs when code is merged to test or directly pushed to test
on:
  push:
    branches:
      - test

# necessary for secrets to be read
permissions:
  contents: read

jobs:
  build_and_push:
    name: Build and Push
    runs-on: ubuntu-latest
    environment: Deployment   # necessary to match where the secret variables are

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image to ECR
        run: |
          docker build --no-cache --build-arg BUILD_MODE=test -t balisongflippingcenter/web/main .
          docker tag balisongflippingcenter/web/main:latest 343218221384.dkr.ecr.us-east-1.amazonaws.com/balisongflippingcenter/web/main:${{ github.sha }}
          docker tag balisongflippingcenter/web/main:latest 343218221384.dkr.ecr.us-east-1.amazonaws.com/balisongflippingcenter/web/main:latest
          docker push 343218221384.dkr.ecr.us-east-1.amazonaws.com/balisongflippingcenter/web/main:${{ github.sha }}
          docker push 343218221384.dkr.ecr.us-east-1.amazonaws.com/balisongflippingcenter/web/main:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_WEB_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 343218221384.dkr.ecr.us-east-1.amazonaws.com
            docker pull 343218221384.dkr.ecr.us-east-1.amazonaws.com/balisongflippingcenter/web/main:latest
            docker stop web-server || true
            docker rm web-server || true
            docker ps -q --filter "publish=80" | xargs -r docker stop
            docker ps -aq --filter "publish=80" | xargs -r docker rm
            docker run -d --name web-server -p 80:80 --restart unless-stopped 343218221384.dkr.ecr.us-east-1.amazonaws.com/balisongflippingcenter/web/main:latest

            for i in $(seq 1 10); do
              if curl -fsS http://localhost/ > /dev/null; then
                echo "Frontend healthy"
                exit 0
              fi
              echo "Not healthy yet, retrying in 5s..."
              sleep 5
            done
            echo "Frontend health check failed after deploy"
            exit 1
