<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1318; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 48px; font-family: monospace; }
  .label { color: #3a4a5a; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; text-align: center; }
  .card { background: #141920; border: 1px solid #1e2830; border-radius: 6px; padding: 32px; display: flex; align-items: center; justify-content: center; gap: 32px; }
</style>
</head>
<body>

  <div style="display:flex;flex-direction:column;align-items:center;">
    <div class="label">Favicon Sizes</div>
    <div class="card">
      <!-- 16x16 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="16" height="16">
          <path d="M 50,50 L 4,7 L 0,13 L 3,20 L 44,54 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 L 4,93 L 0,87 L 3,80 L 44,46 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 C 62,49 78,46 94,42 C 104,39 112,36 116,33 C 110,39 98,45 84,49 C 70,53 56,54 50,52 Z" fill="white" opacity="0.95"/>
          <circle cx="50" cy="50" r="5" fill="white"/>
          <circle cx="50" cy="50" r="2.2" fill="black"/>
        </svg>
        <span style="color:#3a4a5a;font-size:9px;">16px</span>
      </div>
      <!-- 32x32 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
          <path d="M 50,50 L 4,7 L 0,13 L 3,20 L 44,54 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 L 4,7 L 8,3 L 54,46 Z" fill="white" opacity="0.3"/>
          <path d="M 50,50 L 4,93 L 0,87 L 3,80 L 44,46 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 L 4,93 L 8,97 L 54,54 Z" fill="white" opacity="0.3"/>
          <path d="M 50,50 C 62,49 78,46 94,42 C 104,39 112,36 116,33 C 110,39 98,45 84,49 C 70,53 56,54 50,52 Z" fill="white" opacity="0.95"/>
          <circle cx="50" cy="50" r="5" fill="white"/>
          <circle cx="50" cy="50" r="2.2" fill="black"/>
        </svg>
        <span style="color:#3a4a5a;font-size:9px;">32px</span>
      </div>
      <!-- 64x64 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
          <path d="M 50,50 L 4,7 L 0,13 L 3,20 L 44,54 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 L 4,7 L 8,3 L 54,46 Z" fill="white" opacity="0.3"/>
          <path d="M 50,50 L 4,93 L 0,87 L 3,80 L 44,46 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 L 4,93 L 8,97 L 54,54 Z" fill="white" opacity="0.3"/>
          <path d="M 50,50 C 62,49 78,46 94,42 C 104,39 112,36 116,33 C 110,39 98,45 84,49 C 70,53 56,54 50,52 Z" fill="white" opacity="0.95"/>
          <circle cx="50" cy="50" r="5" fill="white"/>
          <circle cx="50" cy="50" r="2.2" fill="black"/>
        </svg>
        <span style="color:#3a4a5a;font-size:9px;">64px</span>
      </div>
      <!-- 128x128 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
          <path d="M 50,50 L 4,7 L 0,13 L 3,20 L 44,54 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 L 4,7 L 8,3 L 54,46 Z" fill="white" opacity="0.3"/>
          <path d="M 50,50 L 4,93 L 0,87 L 3,80 L 44,46 Z" fill="white" opacity="0.95"/>
          <path d="M 50,50 L 4,93 L 8,97 L 54,54 Z" fill="white" opacity="0.3"/>
          <path d="M 50,50 C 62,49 78,46 94,42 C 104,39 112,36 116,33 C 110,39 98,45 84,49 C 70,53 56,54 50,52 Z" fill="white" opacity="0.95"/>
          <circle cx="50" cy="50" r="5" fill="white"/>
          <circle cx="50" cy="50" r="2.2" fill="black"/>
        </svg>
        <span style="color:#3a4a5a;font-size:9px;">128px</span>
      </div>
    </div>
  </div>

</body>
</html>
